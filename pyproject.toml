[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-catcher-bin"
version = "0.1.0"
description = "Laptop-camera prototype for predicting the intercept of a thrown object"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
smart-bin-camera = "smart_bin.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

